name: Actualizar Investigaciones Tacna

on:
  push:
    branches: [main]
    paths:
      - 'etl/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/actualizar_investigaciones.yml'
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

concurrency:
  group: investigaciones-tacna
  cancel-in-progress: false

jobs:
  etl-oaipmh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt

      - name: Test ETL
        run: python -m unittest discover -s tests -v

      - name: Run OAI-PMH ETL
        run: python etl/main_oaipmh.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar modelo web publicado
        run: node tests/test_web.cjs


      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/investigaciones_tacna.csv data/estrella data/modelo_web.json data/modelo_web.json.gz data/manifest.json data/origen.json
          if git diff --staged --quiet; then
            echo "Sin cambios en las investigaciones."
            exit 0
          fi
          git commit -m "chore: update investigaciones dataset [skip ci]"
          git pull --rebase origin main
          git push
